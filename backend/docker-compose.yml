services:
  postgres:
    image: postgres:16-alpine
    container_name: hostel_exchange_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hostel_user
      POSTGRES_PASSWORD: hostel_password
      POSTGRES_DB: hostel_exchange
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hostel_pgdata:/var/lib/postgresql/data

volumes:
  hostel_pgdata:
